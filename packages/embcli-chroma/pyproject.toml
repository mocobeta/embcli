[project]
name = "embcli-chroma"
version = "0.1.0-dev"
description = "ChromaDB integration for embcli"
readme = "README.md"
authors = [{ name = "Tomoko Uchida", email = "tomoko.uchida.1111@gmail.com" }]
requires-python = ">=3.10"
dependencies = ["chromadb>=1.0.9"]

[tool.uv.sources]
embcli-core = { workspace = true }

[project.entry-points."embcli"]
chroma = "embcli_chroma.chroma"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
